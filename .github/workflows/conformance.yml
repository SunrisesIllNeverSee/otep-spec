name: Conformance

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  conformance:
    name: Run OTEP conformance suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Run OTEP conformance suite
        run: node conformance/otep-runner.mjs
      - name: Run OTEP validator on all examples
        run: |
          for f in examples/minimal-valid.json examples/complete-valid.json examples/unsupported-cache.json examples/signed-envelope.json examples/canonical-reference.json; do
            echo "Validating $f..."
            node conformance/otep-validate.mjs "$f" --report text
          done
          echo "Validating invalid payload (expected to fail)..."
          node conformance/otep-validate.mjs examples/invalid-payload.json --report text && exit 1 || echo "Correctly rejected invalid payload"
      - name: Run Python conformance runner
        run: |
          pip install -e python/ --quiet
          python -m sigrank_standard
      - name: Run Python conformance self-test
        run: |
          python3 conformance/tests/runner-self-test.py
      - name: Verify integration examples produce schema-valid envelopes
        run: |
          # TypeScript integration
          node -e "
            import { buildRecord } from './integrations/typescript/example.ts';
            const record = buildRecord(
              { input: 1251211, output: 11296121, cache_write: 128196310, cache_read: 2555179769 },
              { provider: 'anthropic', model: 'claude-sonnet-4', tool: 'claude-code' }
            );
            const fs = await import('fs');
            fs.writeFileSync('/tmp/ts-record.json', JSON.stringify(record, null, 2));
            console.log('TS record written');
          " --input-type=module
          node conformance/otep-validate.mjs /tmp/ts-record.json --report text

          # Python integration
          python3 integrations/python/example.py > /tmp/py-record.json
          node conformance/otep-validate.mjs /tmp/py-record.json --report text

          # CLI integration
          node integrations/cli/example.mjs --input 1251211 --output 11296121 --cache-write 128196310 --cache-read 2555179769 > /tmp/cli-record.json
          node conformance/otep-validate.mjs /tmp/cli-record.json --report text
